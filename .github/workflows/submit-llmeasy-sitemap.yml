name: Submit LLMEasy sitemap

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish LLMEasy docs branch
    types:
      - completed
  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Wait for LLMEasy docs deployment
        run: sleep 120

      - name: Verify LLMEasy redirects and localized SEO
        run: node scripts/check-llmeasy-live-seo.mjs

      - name: Submit LLMEasy sitemap to Google Search Console
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SITE_URL: sc-domain:llmeasy.ru
          SITEMAP_URL: https://docs.llmeasy.ru/sitemap.xml
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token_payload = urllib.parse.urlencode(
              {
                  "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }
          ).encode()
          token_request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=token_payload,
              method="POST",
          )
          with urllib.request.urlopen(token_request) as response:
              token_response = json.loads(response.read())

          access_token = token_response["access_token"]

          encoded_site_url = urllib.parse.quote(os.environ["SITE_URL"], safe="")
          encoded_sitemap_url = urllib.parse.quote(os.environ["SITEMAP_URL"], safe="")
          endpoint = (
              "https://www.googleapis.com/webmasters/v3/sites/"
              f"{encoded_site_url}/sitemaps/{encoded_sitemap_url}"
          )

          request = urllib.request.Request(
              endpoint,
              method="PUT",
              headers={"Authorization": f"Bearer {access_token}"},
          )

          with urllib.request.urlopen(request) as response:
              response.read()
          PY

      - name: Submit LLMEasy URLs to IndexNow
        env:
          INDEXNOW_BEST_EFFORT: "true"
        run: node scripts/submit-indexnow.mjs
