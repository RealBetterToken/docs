name: Submit BetterToken sitemap

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish BetterToken docs
    types:
      - completed
  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Wait for BetterToken docs deployment
        run: sleep 120

      - name: Verify BetterToken redirects and localized SEO
        env:
          BETTERTOKEN_SEO_CHECK_ATTEMPTS: "24"
          BETTERTOKEN_SEO_ALLOW_ACCESS_DENIED: "1"
        run: node scripts/check-bettertoken-live-seo.mjs

      - name: Write verified Docs page receipt
        continue-on-error: true
        env:
          RECEIPT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RECEIPT_SHA}/check-runs" --jq '.check_runs[] | select(.name == "Mintlify Deployment") | .conclusion' | head -n1 || true)"
            if [ "$conclusion" = success ]; then break; fi
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo "Mintlify Deployment check ended: $conclusion" >&2
              exit 1
            fi
            sleep 15
          done
          test "${conclusion:-}" = success
          changed="$(git diff-tree --no-commit-id --name-only -r "$RECEIPT_SHA" || true)"
          routes="$(printf '%s\n' "$changed" | grep -E '\.mdx$' || true)"
          if printf '%s\n' "$changed" | grep -Eq '^(docs\.json|scripts/|custom\.css|llmeasy-metrica-spa\.js\.template)'; then
            routes="$(node --input-type=module - <<'NODE'
            import { readFileSync } from 'node:fs';
            const xml = readFileSync('sitemap.xml', 'utf8');
            for (const match of xml.matchAll(/<loc>https:\/\/docs\.bettertoken\.ai([^<]*)<\/loc>/g)) {
              const route = match[1].replace(/^\//, '').replace(/\/$/, '') || 'index';
              process.stdout.write(`${route}.mdx\n`);
            }
            NODE
            )"
          fi
          test -n "$routes" || exit 0
          args=()
          while IFS= read -r route; do args+=(--route "$route"); done <<< "$routes"
          node scripts/write-seo-page-receipt.mjs \
            --output "$RUNNER_TEMP/seo-page-receipt.json" \
            --source-revision "$RECEIPT_SHA" \
            --release-id "${GITHUB_RUN_ID}-${RECEIPT_SHA}" \
            "${args[@]}"

      - name: Upload verified Docs page receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-page-receipt-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/seo-page-receipt.json
          if-no-files-found: ignore

      - name: Submit BetterToken sitemap to Google Search Console
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SITE_URL: https://docs.bettertoken.ai/
          SITEMAP_URL: https://docs.bettertoken.ai/sitemap.xml
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token_payload = urllib.parse.urlencode(
              {
                  "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }
          ).encode()
          token_request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=token_payload,
              method="POST",
          )
          with urllib.request.urlopen(token_request) as response:
              token_response = json.loads(response.read())

          access_token = token_response["access_token"]

          encoded_site_url = urllib.parse.quote(os.environ["SITE_URL"], safe="")
          encoded_sitemap_url = urllib.parse.quote(os.environ["SITEMAP_URL"], safe="")
          endpoint = (
              "https://www.googleapis.com/webmasters/v3/sites/"
              f"{encoded_site_url}/sitemaps/{encoded_sitemap_url}"
          )

          request = urllib.request.Request(
              endpoint,
              method="PUT",
              headers={"Authorization": f"Bearer {access_token}"},
          )

          with urllib.request.urlopen(request) as response:
              response.read()
          PY

      - name: Submit BetterToken URLs to IndexNow
        env:
          INDEXNOW_BEST_EFFORT: "true"
        run: node scripts/submit-indexnow.mjs
