# Russian is the default language. Historical /ru URLs must go directly to
# the unprefixed canonical route instead of redirecting to a 404 page.
location = /ru/faq/claude-desktop-cowork-code-gateway {
    return 301 /faq/claude-desktop/cowork-code-gateway$is_args$args;
}
location = /ru/faq/claude-desktop-third-party-models {
    return 301 /faq/claude-desktop/third-party-models$is_args$args;
}
location = /ru/faq/codex-official-login-third-party-api {
    return 301 /faq/codex/official-login-third-party-api$is_args$args;
}

# Mintlify currently emits lang="en" and no hreflang links on localized pages.
# Disable upstream compression so sub_filter can update the HTML response.
proxy_set_header Accept-Encoding "";
sub_filter_types text/html;
sub_filter_once on;
sub_filter '<html lang="en"' '<html lang="$docs_language"';
sub_filter '</head>' '<link rel="alternate" hreflang="ru" href="https://docs.llmeasy.ru$docs_unprefixed_path"><link rel="alternate" hreflang="en" href="https://docs.llmeasy.ru/en$docs_unprefixed_path"><link rel="alternate" hreflang="zh-CN" href="https://docs.llmeasy.ru/zh$docs_unprefixed_path"><link rel="alternate" hreflang="x-default" href="https://docs.llmeasy.ru$docs_unprefixed_path"></head>';
